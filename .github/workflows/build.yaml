name: Release

on:
  push:
    tags:
      - '*'
    branches:
      - main
    paths-ignore:
      - README.md
      - catalog.json
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0

      - name: Build and test
        run: |
          devbox run -- make build test-bin lint container test-container

      - name: Login to GitHub Container Registry
        run: |
          devbox run -- bash -c 'echo "${{ github.token }}" | ko login ghcr.io --username "${{ github.actor }}" --password-stdin'

      - name: Release
        run: |
          devbox run -- ./release.sh ${{ github.sha }}
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}

      - name: Create catalog update PR
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ github.token }}
          commit-message: 'Update catalog for build ${{ github.sha }}'
          title: 'Update catalog.json for build ${{ github.sha }}'
          body: |
            Update catalog.json after release of build ${{ github.sha }}
          labels: automated pr
          branch: catalog/update
          delete-branch: true
          add-paths: catalog.json
